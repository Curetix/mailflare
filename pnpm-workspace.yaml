packages:
    - "apps/*"
    - "packages/*"
catalog:
    typescript: ^7.0.2
    react: "^19.3.1"
    react-dom: "^19.3.1"
minimumReleaseAgeExclude:
    - "@astryxdesign/cli@0.7.11"
    - "@astryxdesign/core@0.7.11"
    - "@astryxdesign/theme-neutral@0.7.11"
    - "@cloudflare/vitest-plugin@1.8.2"
    - "@cloudflare/workers-types@5.20261114.1"
    - miniflare@5.20261113.0-beta
    - wrangler@4.162.0
allowBuilds:
    # Postinstall only prints an "astryx init" hint.
    "@astryxdesign/cli": false
    "@astryxdesign/core": false
    # Platform binary checks for wrangler/vitest (esbuild bundler, workerd runtime).
    esbuild: true
    workerd: true
