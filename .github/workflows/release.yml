name: Release

# release-please keeps a release PR open with the next version and changelog,
# from the Conventional Commits on main. Merging it tags vX.Y.Z and creates the
# GitHub release; then the extension is built, attached and sent to the stores.
# See RELEASING.md.

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to build and send to the stores again, e.g. v2.0.0
                required: true
            stores:
                description: Stores to send it to (one that already has this version refuses it)
                type: choice
                options: [both, chrome, firefox]
                default: both
            dry-run:
                description: Only check the store credentials
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    release-please:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            created: ${{ steps.release.outputs.release_created }}
            tag: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v5
              id: release

    extension:
        name: Publish the extension
        needs: release-please
        if: >-
            always() && (needs.release-please.outputs.created == 'true' ||
            github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
            STORES: ${{ inputs.stores || 'both' }}
            DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
            FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID || '{f0bdc9fa-a062-4424-baee-16530c53aa06}' }}
            # unlisted: signed by Mozilla, distributed through the GitHub release.
            FIREFOX_CHANNEL: ${{ vars.FIREFOX_CHANNEL || 'unlisted' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.TAG }}

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build the ZIPs
              working-directory: apps/extension
              run: |
                  pnpm zip
                  pnpm zip:firefox
                  ls -l .output/*.zip

            - name: Attach them to the GitHub release
              if: env.DRY_RUN != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$TAG" apps/extension/.output/*.zip --clobber

            - name: Submit to the Chrome Web Store and Firefox Add-ons
              working-directory: apps/extension
              env:
                  CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID || 'aomfbgcabccoecaoimicmmkjdmdgcfpi' }}
                  # Chrome Web Store API v2 (v1.1 was shut down): a service account of the publisher.
                  CHROME_API_VERSION: v2
                  CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                  CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
                  CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
                  FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
              run: |
                  args=()
                  if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
                  if [ "$STORES" != firefox ]; then args+=(--chrome-zip .output/*-chrome.zip); fi
                  if [ "$STORES" != chrome ]; then
                      args+=(--firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip)
                  fi
                  pnpm wxt submit "${args[@]}"

            - name: Attach the signed Firefox add-on (unlisted channel)
              if: >-
                  env.DRY_RUN != 'true' && env.STORES != 'chrome' &&
                  env.FIREFOX_CHANNEL == 'unlisted'
              working-directory: apps/extension
              env:
                  GH_TOKEN: ${{ github.token }}
                  FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
              run: |
                  node scripts/fetch-signed-xpi.mjs "${TAG#v}"
                  gh release upload "$TAG" .output/*.xpi --clobber
