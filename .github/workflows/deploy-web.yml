name: Deploy web

# The web app (app.mailflare.cc, with its Cloudflare API proxy) and the landing
# page (mailflare.cc), as Cloudflare Pages projects, once CI passed for a push
# to main. See RELEASING.md.

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-web
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy ${{ matrix.site.name }}
        # After a successful CI run for a push (not a pull request), or by hand from main.
        if: >-
            (github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push') ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                site:
                    - name: web app
                      package: "@mailflare/web"
                      project: app
                    - name: landing page
                      package: "@mailflare/landing"
                      project: landing
        steps:
            - uses: actions/checkout@v7
              with:
                  # The commit CI checked.
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter "${{ matrix.site.package }}" build

            # From the app's directory: wrangler also deploys its functions/ folder.
            # The Cloudflare token is only given to this step.
            - name: Deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  PROJECT: >-
                      ${{ matrix.site.project == 'app' && (vars.PAGES_APP_PROJECT || 'mailflare-app')
                      || (vars.PAGES_LANDING_PROJECT || 'mailflare-landing') }}
              run: pnpm --filter "${{ matrix.site.package }}" run deploy --project-name "$PROJECT"
