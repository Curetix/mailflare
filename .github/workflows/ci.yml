name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Lint, types, tests, builds
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # Uses the pnpm version from package.json's packageManager.
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm exec oxlint

            - name: Formatting
              run: pnpm exec oxfmt --check

            - name: Types
              run: pnpm check-types

            - name: Tests
              run: pnpm test

            - name: Build
              run: pnpm build
